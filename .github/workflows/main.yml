name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: |
          npm install
          npx playwright install --with-deps

      - name: Build Docker image
        run: |
          # Remove the database initialization from Dockerfile temporarily
          sed -i '/RUN python init_db.py/d' Dockerfile
          docker build -t bookstore .

      - name: Start Docker container
        run: |
          docker run -d -p 8000:8000 --name bookstore-test \
            --health-cmd "curl -f http://localhost:8000/health || exit 1" \
            --health-interval 10s --health-timeout 5s --health-retries 5 \
            bookstore
          sleep 10  # Wait for the container to start

      - name: Verify container health
        run: |
          if ! docker ps | grep -q bookstore-test; then
            echo "Container failed to start. Checking logs..."
            docker logs bookstore-test || true
            exit 1
          fi
          echo "Container is running successfully"

      - name: Initialize test database
        run: |
          # Wait for the application to be ready
          until curl -s http://localhost:8000/health > /dev/null; do
            echo "Waiting for application to be ready..."
            sleep 2
          done
          cd bookstore
          python init_db.py
          cd ..

      - name: Run tests
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          npx playwright test --reporter=html,junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Tests failed! Check the [test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

      - name: Cleanup
        if: always()
        run: |
          docker stop bookstore-test || true
          docker rm bookstore-test || true
