name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            xvfb \
            fonts-noto-color-emoji \
            fonts-unifont

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ No requirements.txt found, skipping pip install"
          fi
          npm install
          npm install playwright@1.42.1
          npm install -D @playwright/test@1.42.1
          npx playwright install

      - name: Build Docker image
        run: |
          sed -i '/RUN python init_db.py/d' Dockerfile
          docker build -t bookstore .

      - name: Start Docker container
        run: |
          docker run -d -p 8000:8000 --name bookstore-test \
            --health-cmd "curl -f http://localhost:8000/health || exit 1" \
            --health-interval 10s --health-timeout 5s --health-retries 5 \
            bookstore
          sleep 10  # Wait for the container to start

      - name: Verify container health
        run: |
          if ! docker ps | grep -q bookstore-test; then
            echo "Container failed to start. Checking logs..."
            docker logs bookstore-test || true
            exit 1
          fi
          echo "Container is running successfully"

      - name: Initialize test database
        run: |
          until curl -s http://localhost:8000/health > /dev/null; do
            echo "Waiting for application to be ready..."
            sleep 2
          done
          cd bookstore
          python init_db.py
          cd ..

      - name: Run tests
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test --reporter=html,junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitMessage = context.payload.head_commit?.message || 'Direct push';
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;

            const message = `❌ Tests failed in direct push to main branch!\n\n**Commit Message:** ${commitMessage}\n**Commit URL:** ${commitUrl}\n**Run URL:** ${runUrl}\n\nPlease check the test results in the artifacts section of the run.`;

            if (context.payload.pull_request) {
              // For pull requests
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            } else {
              // For direct pushes, create a new issue
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Test failure in direct push: ${commitMessage.substring(0, 50)}${commitMessage.length > 50 ? '...' : ''}`,
                body: message,
                labels: ['test-failure', 'ci-failure']
              });
            }

      - name: Cleanup
        if: always()
        run: |
          docker stop bookstore-test || true
          docker rm bookstore-test || true
